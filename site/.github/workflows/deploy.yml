name: Deploy Blazor Web App to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Publish Blazor Web App
        run: dotnet publish Portfolio/portfolio.main/portfolio.main.csproj -c Release -o publish

      - name: Copy published files
        run: |
          rm -rf ./*
          cp -r publish/wwwroot/* .
          echo "" > .nojekyll
          find . -type f \( -name "*.br" -o -name "*.gz" \) -delete

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated deploy from GitHub Actions"
          git push origin main