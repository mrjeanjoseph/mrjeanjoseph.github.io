name: Deploy Blazor Web App to GitHub Pages (docs folder)

on:
  push:
    branches:
      - main

jobs:
  build:
    # Skip if commit message tagged as local deploy
    if: ${{ !contains(github.event.head_commit.message, '[local-deploy]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"

      - name: Publish Blazor Web App
        run: dotnet publish portfolio.main/portfolio.main.csproj -c Release -o publish

      - name: Copy published files into docs/
        run: |
          rm -rf docs/*
          cp -r publish/wwwroot/* docs/
          echo "" > docs/.nojekyll
          if [ -d "docs/_framework" ]; then
            find docs/_framework -type f \( -name "*.br" -o -name "*.gz" \) -delete
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Automated deploy to docs folder"
          git push origin main
